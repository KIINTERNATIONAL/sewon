<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>세원이 기말고사 필기장</title>
<link rel="manifest" href="app.webmanifest">
<meta name="theme-color" content="#26272a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* VOICE: 조용한 공부 도구 — 손이 가는 곳만 보이게
   IDEA: 색인 탭이 달린 바인더, 책상 위에 펼친 시험지
   PICTURE: 시험지 자체가 화면을 채움, 도구는 왼쪽 연필통처럼
   COLOUR and TYPE: 짙은 책상색 바탕 + 흰 종이, 과목별 탭 색 하나씩 / IBM Plex Sans KR
   LAYOUT: 상단 탭바, 왼쪽 세로 도구막대(좁으면 하단), 가운데 페이지 스크롤 */
:root{color-scheme:light dark;
  --desk:light-dark(#d9d6cf,#1d1e20);--bar:light-dark(#fbfaf7,#26272a);--ink:light-dark(#1c1c1e,#ecebe8);
  --mute:light-dark(#6b6a66,#a3a29d);--line:light-dark(#e2dfd8,#37383c);--chip:light-dark(#efece6,#313236);
  --acc:#ff6b4a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font:15px/1.4 system-ui,"Samsung Sans","Noto Sans KR",sans-serif;overflow:hidden;
  display:grid;grid-template-rows:auto 1fr;grid-template-columns:auto 1fr;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{grid-column:1/3;display:flex;align-items:flex-end;gap:6px;padding:8px 10px 0;background:var(--bar);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto}
.tab{flex:none;padding:10px 16px 11px;border-radius:10px 10px 0 0;font-weight:500;color:var(--mute);border-top:4px solid transparent;min-height:44px}
.tab[aria-selected=true]{color:var(--ink);background:var(--desk);border-top-color:var(--c)}
.hd-r{display:flex;align-items:center;gap:6px;padding-bottom:6px;flex:none}
.pill{height:36px;padding:0 12px;border-radius:18px;background:var(--chip);font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill b{font-weight:600}
#save{font-size:13px;color:var(--mute);white-space:nowrap;padding:0 4px}
#save.err{color:#e5484d}
.secs{display:flex;gap:6px;padding:0 0 6px}
/* toolbar */
#tools{grid-row:2;background:var(--bar);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;overflow-y:auto;scrollbar-width:none;width:68px;z-index:2}
.tb{flex:none;width:54px;height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mute)}
.tb svg{width:22px;height:22px;flex:none}
.tb[aria-pressed=true]{background:var(--chip);color:var(--ink)}
.tb small{font-size:10.5px;line-height:1;white-space:nowrap}
.sep{width:36px;height:1px;background:var(--line);margin:4px 0;flex:none}
.sw{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.sw i{width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.sz{width:44px;height:34px;display:grid;place-items:center;border-radius:10px;flex:none}
.sz i{display:block;border-radius:9px;background:var(--mute)}
.sz[aria-pressed=true]{background:var(--chip)}.sz[aria-pressed=true] i{background:var(--ink)}
#zoomv{font-size:12px;color:var(--mute);height:24px;display:grid;place-items:center}
/* viewer */
#view{grid-row:2;overflow:auto;touch-action:none;position:relative;overscroll-behavior:contain}
#col{margin:0 auto;padding:16px 16px 40vh;width:calc(var(--pw,800px) + 32px)}
.pg{margin:0 0 22px}
.pgh{display:flex;align-items:center;gap:6px;height:40px;color:var(--mute);font-size:13px}
.pgh .n{margin-right:auto;font-weight:500}
.mk{height:32px;padding:0 10px;border-radius:16px;font-size:13px;background:var(--chip);color:var(--mute)}
.mk[aria-pressed=true]{color:#fff;background:var(--m)}
.mk.clr{background:none}.mk.clr.arm{background:#e5484d;color:#fff}
.sheet{position:relative;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18),0 6px 20px rgba(0,0,0,.14);border-radius:3px;overflow:hidden}
.sheet img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none;-webkit-user-drag:none}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:multiply}
body.noink .sheet canvas.ink{visibility:hidden}
.sec{margin:6px 0 10px;padding:6px 0;font-weight:600;color:var(--ink);font-size:16px;border-bottom:2px solid var(--c)}
/* sheet panel */
#panel{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:5;align-items:flex-start;justify-content:center;padding:70px 16px 16px}
#panel.on{display:flex}
.box{background:var(--bar);border-radius:16px;padding:16px;width:min(720px,100%);max-height:calc(100vh - 100px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.box h2{margin:0 0 10px;font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.box h2 button{margin-left:auto;height:40px;padding:0 14px;border-radius:20px;background:var(--chip);font-size:14px;font-weight:500}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.flt button{height:36px;padding:0 14px;border-radius:18px;background:var(--chip);font-size:14px}
.flt button[aria-pressed=true]{background:var(--ink);color:var(--bar)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.grid button{height:56px;border-radius:10px;background:var(--chip);font-weight:600;font-variant-numeric:tabular-nums;position:relative}
.grid button.cur{outline:2px solid var(--ink)}
.grid button i{position:absolute;left:6px;right:6px;bottom:6px;height:4px;border-radius:2px;background:var(--m)}
.empty{color:var(--mute);padding:20px 0;text-align:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bar);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6}
#toast.on{opacity:1}
.help{color:var(--mute);font-size:13px;margin-top:14px;line-height:1.6}
#msg{padding:60px 20px;text-align:center;color:var(--mute)}
@media (max-width:700px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  #tools{grid-row:3;grid-column:1;flex-direction:row;width:auto;height:64px;border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;padding:6px 8px}
  .sep{width:1px;height:36px;margin:0 4px}
  #view{grid-column:1}
  header{grid-column:1}
  .tab{padding:10px 12px 11px}
  #save{display:none}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="hd-r">
    <button class="pill" id="pgbtn" aria-label="페이지 목록"><span id="pgcur">–</span></button>
    <span id="save">불러오는 중</span>
    <button class="pill" id="fs" aria-label="전체화면">전체화면</button>
  </div>
</header>

<nav id="tools" aria-label="필기 도구">
  <button class="tb" data-tool="pen" aria-pressed="true" aria-label="펜"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.6L16.5 4.1a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M14.5 6l3.5 3.5"/></svg><small>펜</small></button>
  <button class="tb" data-tool="hl" aria-pressed="false" aria-label="형광펜"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-3 3v3h3l3-3"/><path d="M9 14l6.5-9.5 4 4L10 15z"/><path d="M4 21h16" stroke-width="2.6" opacity=".45"/></svg><small>형광</small></button>
  <button class="tb" data-tool="er" aria-pressed="false" aria-label="지우개"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20h12"/><path d="M4.6 14.6l9.2-9.2a2 2 0 0 1 2.8 0l3 3a2 2 0 0 1 0 2.8L12 18.8a2 2 0 0 1-1.4.6H8.4a2 2 0 0 1-1.4-.6l-2.4-2.4a2 2 0 0 1 0-2.8z"/><path d="M9 10l5 5"/></svg><small>지우개</small></button>
  <div class="sep"></div>
  <div id="sws" style="display:contents"></div>
  <div class="sep"></div>
  <div id="szs" style="display:contents"></div>
  <div class="sep"></div>
  <button class="tb" id="undo" aria-label="실행취소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><small>취소</small></button>
  <button class="tb" id="redo" aria-label="다시실행"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg><small>다시</small></button>
  <div class="sep"></div>
  <button class="tb" id="hide" aria-pressed="false" aria-label="필기 숨기기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><small>필기보기</small></button>
  <button class="tb" id="finger" aria-pressed="false" aria-label="손가락으로 필기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5"/><path d="M12 10V8.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5-2.7L4 15a1.5 1.5 0 0 1 2.5-1.6L9 16"/></svg><small>손필기</small></button>
  <div class="sep"></div>
  <button class="tb" id="zin" aria-label="확대"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-4-4"/></svg></button>
  <div id="zoomv">100%</div>
  <button class="tb" id="zout" aria-label="축소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-4-4"/></svg></button>
</nav>

<main id="view"><div id="col"><div id="msg">시험지를 불러오는 중…</div></div></main>

<div id="panel" role="dialog" aria-modal="true" aria-label="페이지 목록">
  <div class="box">
    <h2><span id="ptitle">페이지</span><button id="pclose">닫기</button></h2>
    <div class="flt" id="pflt"></div>
    <div class="grid" id="pgrid"></div>
    <div class="secs" id="psecs" style="margin-top:12px;flex-wrap:wrap"></div>
    <div class="flt" style="margin-top:16px;align-items:center">
      <button id="bexp">백업 파일 만들기</button>
      <label class="pill" style="height:36px;cursor:pointer">백업 불러오기<input type="file" id="bimp" accept=".json,application/json" hidden></label>
      <span id="bmsg" style="font-size:13px;color:var(--mute)"></span>
    </div>
    <p class="help">필기는 이 기기 안에만 저장되고 인터넷이 없어도 돼. 브라우저의 '인터넷 사용 기록 삭제'에서 사이트 데이터까지 지우면 필기도 같이 지워지니까 가끔 백업 파일을 만들어 둬.<br>S펜으로 쓰고, 손가락 한 개로 스크롤, 두 개로 확대·축소. S펜 옆 버튼을 누른 채로 그으면 지우개가 돼 (기기 설정에 따라 다를 수 있어). '필기보기'를 끄면 깨끗한 시험지로 다시 풀어볼 수 있어.</p>
  </div>
</div>
<div id="toast"></div>

<script>
{
const $ = s => document.querySelector(s);
const view = $('#view'), col = $('#col');
const SUBJ_COLORS = ['#ff6b4a', '#3ea0ff', '#f5b70a', '#9b7bff', '#1fbf8f'];
const MARKS = [{k:'imp', t:'중요', c:'#e5484d'}, {k:'again', t:'다시', c:'#f59e0b'}, {k:'done', t:'완료', c:'#16a34a'}];
const PALETTE = {
  pen: [{c:'#1b1b1f'}, {c:'#e5383b'}, {c:'#1d64d8'}],
  hl: [{c:'#ffe14d'}, {c:'#86e08f'}, {c:'#ff9ccf'}]
};
const SIZES = {pen: [1.5, 2.5, 4], hl: [12, 20, 30], er: [10, 20, 36]};
const esc = v => String(v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

/* ---------- local storage helpers ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('sw:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sw:' + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};

/* ---------- state ---------- */
let M = null, S = null, si = 0;
let pages = [];
const ann = {};            // key -> {t, s:[strokes]}
let marks = LS.get('marks', {m:{}, t:0});
const ui = LS.get('ui', {tool:'pen', col:{pen:0, hl:0}, size:{pen:1, hl:1, er:1}, finger:false, zoom:1, subj:0, pos:{}});
let hideInk = false;
let zoom = ui.zoom || 1;
let undoS = [], redoS = [];

/* ---------- toast ---------- */
let tt = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800); }

/* ---------- save status ---------- */
function status(txt, err) { const s = $('#save'); s.textContent = txt; s.classList.toggle('err', !!err); }

/* ---------- toolbar ---------- */
function renderTools() {
  document.querySelectorAll('[data-tool]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === ui.tool));
  const sws = $('#sws');
  if (ui.tool === 'er') sws.innerHTML = '';
  else sws.innerHTML = PALETTE[ui.tool].map((p, i) => `<button class="sw" data-sw="${i}" aria-label="색 ${i+1}" aria-pressed="${ui.col[ui.tool] === i}" style="--c:${p.c}"><i></i></button>`).join('');
  $('#szs').innerHTML = SIZES[ui.tool].map((v, i) => {
    const d = [6, 10, 16][i];
    return `<button class="sz" data-sz="${i}" aria-label="굵기 ${i+1}" aria-pressed="${ui.size[ui.tool] === i}"><i style="width:${ui.tool==='hl'?22:d}px;height:${d}px"></i></button>`;
  }).join('');
  $('#finger').setAttribute('aria-pressed', !!ui.finger);
  $('#hide').setAttribute('aria-pressed', hideInk);
  $('#zoomv').textContent = Math.round(zoom * 100) + '%';
}
$('#tools').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tool) { ui.tool = b.dataset.tool; }
  else if (b.dataset.sw) { ui.col[ui.tool] = +b.dataset.sw; }
  else if (b.dataset.sz) { ui.size[ui.tool] = +b.dataset.sz; }
  else if (b.id === 'finger') { ui.finger = !ui.finger; toast(ui.finger ? '손가락으로도 필기돼 (스크롤은 막대·휠로)' : '이제 펜으로만 필기돼'); }
  else if (b.id === 'hide') { hideInk = !hideInk; document.body.classList.toggle('noink', hideInk); toast(hideInk ? '필기 숨김 — 깨끗한 시험지로 풀어보기' : '필기 다시 보기'); }
  else if (b.id === 'undo') undo();
  else if (b.id === 'redo') redo();
  else if (b.id === 'zin') setZoom(zoom * 1.25);
  else if (b.id === 'zout') setZoom(zoom / 1.25);
  else return;
  saveUi(); renderTools();
});
let uiT = 0;
function saveUi() { clearTimeout(uiT); uiT = setTimeout(() => { ui.zoom = zoom; LS.set('ui', ui); }, 300); }

/* ---------- subjects / layout ---------- */
function renderTabs() {
  $('#tabs').innerHTML = M.subjects.map((s, i) =>
    `<button class="tab" role="tab" data-si="${i}" aria-selected="${i === si}" style="--c:${SUBJ_COLORS[i % SUBJ_COLORS.length]}">${esc(s.name)}</button>`).join('');
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-si]'); if (b && +b.dataset.si !== si) openSubject(+b.dataset.si); });

function baseW() { return Math.min(view.clientWidth - 32, 1000); }
function applyWidth() { col.style.setProperty('--pw', (baseW() * zoom) + 'px'); }

let io = null;
function openSubject(i) {
  rememberPos();
  si = i; S = M.subjects[i]; ui.subj = i; saveUi();
  document.documentElement.style.setProperty('--acc', SUBJ_COLORS[i % SUBJ_COLORS.length]);
  renderTabs();
  undoS = []; redoS = [];
  pages.forEach(p => dropCanvas(p));
  const secAt = {}; (S.sections || []).forEach(s => { secAt[s.start] = s.name; });
  const color = SUBJ_COLORS[i % SUBJ_COLORS.length];
  col.innerHTML = S.pages.map((p, j) => {
    const key = S.id + '-' + String(j + 1).padStart(3, '0');
    const sec = secAt[j + 1] ? `<div class="sec" style="--c:${color}" id="sec-${j+1}">${esc(secAt[j + 1])}</div>` : '';
    return `${sec}<section class="pg" data-i="${j}" data-key="${key}">
      <div class="pgh"><span class="n">${j + 1} / ${S.pages.length}</span>
        ${MARKS.map(m => `<button class="mk" data-mk="${m.k}" style="--m:${m.c}" aria-pressed="false">${m.t}</button>`).join('')}
        <button class="mk clr" data-clr>지우기</button></div>
      <div class="sheet" style="aspect-ratio:${p.w}/${p.h}"><img alt="${j + 1}쪽" width="${p.w}" height="${p.h}" draggable="false"></div>
    </section>`;
  }).join('');
  pages = [...col.querySelectorAll('.pg')].map((el, j) => ({
    i: j, key: el.dataset.key, src: S.pages[j].src, w: S.pages[j].w, h: S.pages[j].h,
    el, sheet: el.querySelector('.sheet'), img: el.querySelector('img'), cv: null, ctx: null
  }));
  pages.forEach(p => { if (!ann[p.key]) ann[p.key] = LS.get('a:' + p.key, {t:0, s:[]}); });
  renderMarks();
  applyWidth();
  if (io) io.disconnect();
  io = new IntersectionObserver(ents => {
    for (const en of ents) {
      const p = pages[+en.target.dataset.i];
      if (en.isIntersecting) { if (!p.img.src) p.img.src = p.src; ensureCanvas(p); }
      else dropCanvas(p);
    }
  }, {root: view, rootMargin: '1400px 0px'});
  pages.forEach(p => io.observe(p.el));
  const pos = ui.pos && ui.pos[S.id];
  requestAnimationFrame(() => { view.scrollTop = pos ? pos * col.scrollHeight : 0; updateCur(); });
}
function rememberPos() { if (S && col.scrollHeight) { ui.pos = ui.pos || {}; ui.pos[S.id] = view.scrollTop / col.scrollHeight; saveUi(); } }

/* ---------- canvases ---------- */
function canvasScale(p) {
  const w = p.sheet.clientWidth || baseW() * zoom;
  let dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  let px = w * dpr;
  const maxW = 4096, maxArea = 12e6, h = px * p.h / p.w;
  if (px > maxW) px = maxW;
  if (px * (px * p.h / p.w) > maxArea) px = Math.sqrt(maxArea * p.w / p.h);
  return Math.floor(px);
}
function ensureCanvas(p) {
  if (p.cv) return;
  const cv = document.createElement('canvas'); cv.className = 'ink';
  p.sheet.appendChild(cv); p.cv = cv; p.ctx = cv.getContext('2d');
  sizeCanvas(p);
}
function sizeCanvas(p) {
  if (!p.cv) return;
  const W = canvasScale(p), H = Math.round(W * p.h / p.w);
  if (p.cv.width !== W || p.cv.height !== H) { p.cv.width = W; p.cv.height = H; }

      const v = d.ann[k]; if (!v || !Array.isArray(v.s)) continue;
      ann[k] = {t: +v.t || Date.now(), s: v.s.map(s => ({k: s.k === 'h' ? 'h' : 'p', c: /^#[0-9a-f]{6}$/i.test(s.c) ? s.c : '#1b1b1f', w: +s.w || 2, p: Array.isArray(s.p) ? s.p.map(Number) : []}))};
      pending.add(k); n++;
    }
    if (d.marks && d.marks.m && typeof d.marks.m === 'object') { marks = {m: d.marks.m, t: Date.now()}; marksDirty = true; }
    await flush();
    pages.forEach(p => { if (!ann[p.key]) ann[p.key] = {t: 0, s: []}; redraw(p); });
    renderMarks(); renderPanel();
    $('#bmsg').textContent = n + '쪽 필기를 불러왔어';
  } catch (err) { $('#bmsg').textContent = '이 파일은 백업 파일이 아니야'; }
});

/* ---------- boot ---------- */
renderTools();
(async () => {
  idb = await openIdb();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  for (const [k, v] of await idbAll('ann')) if (v && Array.isArray(v.s)) ann[k] = v;
  const meta = await idbAll('meta');
  const mk = meta.find(x => x[0] === 'marks');
  if (mk && mk[1] && (mk[1].t || 0) >= (marks.t || 0)) marks = mk[1];
  status(idb ? '이 기기에 저장됨' : '이 브라우저는 저장이 불안정해 — 백업을 자주 해줘', !idb);
  try {
    const m = await (await fetch('pages.json')).json();
    M = m; document.title = m.title || document.title;
    if (!M.subjects || !M.subjects.length) { col.innerHTML = '<div id="msg">아직 시험지가 없어</div>'; return; }
    openSubject(Math.min(ui.subj || 0, M.subjects.length - 1));
  } catch (e) { col.innerHTML = '<div id="msg">시험지를 불러오지 못했어. 처음 한 번은 인터넷에 연결된 상태로 열어줘.</div>'; }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    try { await navigator.serviceWorker.register('sw.js'); } catch (e) {}
  }
})();
}
</script>
